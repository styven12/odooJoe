<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vérification de sécurité · Mini-Odoo</title>
  <style>
    :root{color-scheme:dark;--bg:#080b12;--text:#e8eef8;--muted:#91a0b8;--cyan:#5ce1e6;--line:#29354a}
    body{margin:0;min-height:100vh;display:grid;place-items:center;color:var(--text);font:14px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;background:radial-gradient(ellipse at 50% 25%,#293c6150,transparent 48%),var(--bg)}
    .card{width:min(460px,92vw);border:1px solid var(--line);border-radius:20px;padding:38px;text-align:center;background:linear-gradient(145deg,#141d2bf5,#0c121df5);box-shadow:0 28px 90px #0008}
    .code{font-size:52px;font-weight:800;letter-spacing:-.05em;background:linear-gradient(110deg,#f0bd5c,#ff748b);-webkit-background-clip:text;background-clip:text;color:transparent}
    h1{font-size:20px;margin:8px 0 6px}
    p{margin:0 0 18px;color:var(--muted)}
    a.btn{display:inline-flex;align-items:center;gap:8px;border-radius:11px;padding:9px 14px;font-size:12px;font-weight:700;text-decoration:none;color:#071116;background:linear-gradient(110deg,var(--cyan),#90f6d3)}
  </style>
</head>
<body>
  <div class="card">
    <div class="code">403</div>
    <h1>Vérification de sécurité (CSRF) échouée</h1>
    <p>Votre session a probablement expiré ou la requête provient d'une page obsolète. Revenez à l'accueil puis refaites l'action : elle sera acceptée.</p>
    <a class="btn" href="/">Retour à l'accueil</a>
  </div>
</body>
</html>
